

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: watchnt_backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./meetings:/app/meetings
      - ./data:/app/data
      - whisper-cache:/root/.cache/huggingface
    environment:
      - WATCHNT_ALLOW_DOCKER_HOST=1
      - DATABASE_URL=sqlite:////app/data/watchnt.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped


volumes:
  whisper-cache:
